server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backtest rechnet bis zu ~1 min, Standard-Timeout (60 s) wäre zu knapp
    location /api/backtest {
        proxy_pass http://trading-bot:8000;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://trading-bot:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://trading-bot:8000;
        proxy_set_header Host $host;
    }

    # /metrics bewusst nicht durchgereicht: Prometheus liest direkt im internen Netz (trading-bot:8000/metrics)
    location /metrics {
        return 404;
    }

    client_max_body_size 10M;
}
